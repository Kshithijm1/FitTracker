services:
  - type: web
    name: fittrack-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: APPLE_BUNDLE_ID
        value: com.kshithijm.fittrack
      - key: APPLE_TEAM_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
